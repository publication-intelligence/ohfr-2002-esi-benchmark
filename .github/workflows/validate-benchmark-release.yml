name: Validate frozen benchmark release

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate benchmark v3 and release controls
        run: python3 scripts/validate_benchmark_release.py
